[package]
name = "harness-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Harness Slint UI: the compiled .slint components and bundled translations."
build = "build.rs"

[features]
default = []
automation = ["slint/mcp"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = [
  "std",
  "compat-1-2",
  "backend-winit",
  "renderer-software",
  "renderer-femtovg",
  "renderer-skia",
  "accessibility",
  "unstable-winit-030",
] }

[build-dependencies]
slint-build = "=1.18.1"

[lints.rust]
unsafe_code = "deny"
