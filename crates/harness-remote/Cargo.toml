[package]
name = "harness-remote"
version = "0.1.0"
description = "Remote phone access for Harness: loopback HTTP + WebSocket bridge to HarnessCore with device pairing (spec phase-12-remote-phone.md)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
harness-core-api = { path = "../harness-core-api" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "net", "io-util", "sync", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
base64 = { workspace = true }
getrandom = "0.3"
subtle = "2"
# Remote Control relay (docs/plans/remote-relay.md): Ed25519 identity, HKDF + AES-256-GCM, wss client.
ring = "0.17"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[lints]
workspace = true
