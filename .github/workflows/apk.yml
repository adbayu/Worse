name: apk

# Attaches the Android remote client (Worse-Harness-android.apk) to every release tag.
# The APK is only rebuilt when apps/harness-mobile changed since the previous tag; otherwise the previous
# release's APK is copied over, so every release still has one.
# Signing: the repository secret ANDROID_DEBUG_KEYSTORE (base64 of a debug.keystore) keeps the signature the
# same across releases, so a new APK installs over the old one. Without it the runner's own key is used.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the APK to (e.g. v0.1.13)"
        required: true
      force:
        description: "Rebuild even when apps/harness-mobile did not change"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  APK: Worse-Harness-android.apk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml may create it at the same moment: a failed create is fine when it exists afterwards.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY" \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

      - name: Changed since the previous tag?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          echo "previous tag: ${prev:-none}"
          mkdir -p dist
          if [ "$FORCE" != "true" ] && [ -n "$prev" ] && git diff --quiet "$prev" "$TAG" -- apps/harness-mobile \
            && gh release download "$prev" --pattern "$APK" --dir dist --repo "$GITHUB_REPOSITORY"; then
            echo "apps/harness-mobile unchanged: reusing the $prev APK"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.check.outputs.build == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.check.outputs.build == 'true'

      - name: Signing key
        if: steps.check.outputs.build == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE is not set: this APK is signed with a throwaway key and will not install over a previous one"
          fi

      - name: Build
        if: steps.check.outputs.build == 'true'
        working-directory: apps/harness-mobile
        run: |
          version=$(echo "${TAG#v}" | cut -d- -f1 | cut -d+ -f1)
          IFS=. read -r major minor patch <<< "$version"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PappVersion="$version" -PappVersionCode="$code"
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist/$APK"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dist/$APK" --clobber --repo "$GITHUB_REPOSITORY"
